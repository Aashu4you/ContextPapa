
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: knowbase-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: knowbase
      POSTGRES_PASSWORD: knowbase_dev_password
      POSTGRES_DB: knowbase_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowbase -d knowbase_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
